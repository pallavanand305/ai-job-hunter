services:
  app:
    build: .
    container_name: ai-job-hunter
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/jobhunter.db
      HOST: 0.0.0.0
    volumes:
      - ./data:/app/data
    restart: unless-stopped

